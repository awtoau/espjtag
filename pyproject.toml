[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "espjtag"
version = "0.1.0"
description = "Pure-Python RISC-V JTAG debugger for the ESP32 built-in USB-JTAG (no OpenOCD)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "AWTO" }]
keywords = ["esp32", "esp32c6", "jtag", "riscv", "debug", "usb-jtag", "openocd"]
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
# The MCP server (python -m espjtag.mcp) needs the official MCP Python SDK.
# It's an EXTRA, not a core dep: `import espjtag` and the CLI work without it
# (the SDK is imported lazily inside espjtag.mcp_server.build_server).
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/awtoau/espjtag"

[project.scripts]
espjtag = "espjtag.__main__:main"
espjtag-mcp = "espjtag.mcp_server:main"

[tool.setuptools]
packages = ["espjtag"]
