# Bench fixture: pins the esptool fork's reset delays back to UPSTREAM STOCK
# values, so flash_bench flashers can isolate the device-diff feature from the
# fast-reset feature (ESPTOOL_CFGFILE points here for the non"-fast" variants).
[esptool]
usb_jtag_serial_reset_delay = 0.1
usb_hard_reset_delay = 0.2
